# Deployment template. Use a managed PostgreSQL URL and a TLS reverse proxy.
# Copy backend/.env.production.example to backend/.env.production and inject secrets securely.
services:
  api:
    build: ./backend
    env_file: ./backend/.env.production
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
